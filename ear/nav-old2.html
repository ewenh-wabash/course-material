    function getUnitColor(avgScore) {
      const score = Math.max(0, Math.min(100, avgScore)); // clamp 0–100

      if (score <= 50) {
        // red -> yellow
        const t = score / 50;
        const r = Math.round(220 + (255 - 220) * t); // 220 -> 255
        const g = Math.round(53 + (193 - 53) * t);   // 53 -> 193
        const b = Math.round(69 + (7 - 69) * t);     // 69 -> 7
        return `rgba(${r},${g},${b},0.5)`;
      } else {
        // yellow -> green
        const t = (score - 50) / 50;
        const r = Math.round(255 + (40 - 255) * t); // 255 -> 40
        const g = Math.round(193 + (167 - 193) * t); // 193 -> 167
        const b = Math.round(7 + (69 - 7) * t);      // 7 -> 69
        return `rgba(${r},${g},${b},0.5)`;
      }
    }
