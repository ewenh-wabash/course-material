<!DOCTYPE html>
<html>
<head>
  <style>
    .locked {
      background-color: #e9ecef !important;
      color: #6c757d !important;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .unlocked {
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .unlocked:hover {
      background-color: #f0f8ff;
    }

    .card-header {
      font-weight: 600;
      font-size: 1.2rem;
    }

    .large-icon {
      font-size: 1.5em;
      line-height: 0;
      position: relative;
      top: 0.1em;
      display: inline-block;
    }

    .large-lock {
      font-size: 1.5em;
      line-height: 0;
      position: relative;
      display: inline-block;
    }

    .unit-flex {
      display: flex !important;
      align-items: center;
      justify-content: space-between;
        width: 100%; /* <-- this is the key */
    }
  </style>

  <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
  <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <div id="header"></div>

  <div id="modulesContainer" class="container mt-4"></div>

  <hr>
  <div class="container mt-4">
    <h2>Debug Lock/Unlock</h2>
    <div id="debugButtons" class="d-flex flex-wrap gap-2"></div>
  </div>

  <hr>
  <div class="container mt-4">
    <h2>All Unit Links</h2>
    <div id="rawLinks"></div>
  </div>

<script type="module">

function getUnitColor(avgScore) {
  const score = Math.max(0, Math.min(100, avgScore));

  if (score <= 50) {
    const t = score / 50;
    const r = Math.round(220 + (255 - 220) * t);
    const g = Math.round(53 + (193 - 53) * t);
    const b = Math.round(69 + (7 - 69) * t);
    return `rgba(${r},${g},${b},0.35)`;
  } else {
    const t = (score - 50) / 50;
    const r = Math.round(255 + (40 - 255) * t);
    const g = Math.round(193 + (167 - 193) * t);
    const b = Math.round(7 + (69 - 7) * t);
    return `rgba(${r},${g},${b},0.35)`;
  }
}

import { auth } from './auth.js';
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { setupPage } from './layout.js';

import { dictionary } from "../../../dictionary.js";

const db = getFirestore();
setupPage();

const modulesContainer = document.getElementById("modulesContainer");
const debugContainer = document.getElementById("debugButtons");
const rawLinksContainer = document.getElementById("rawLinks");

auth.onAuthStateChanged(async (user) => {

  if (!user) {
    modulesContainer.innerHTML = "Please log in first.";
    return;
  }

  const userSnap = await getDoc(doc(db, "users", user.uid));
  const userData = userSnap.exists() ? userSnap.data() : {};

  const modulesSnap = await getDocs(
    query(collection(db, "modules"), orderBy("num"))
  );

  const unitsSnap = await getDocs(
    query(collection(db, "units"), orderBy("num"))
  );

  const modules = [];
  modulesSnap.forEach(doc => modules.push({ id: doc.id, ...doc.data() }));

  const units = [];
  unitsSnap.forEach(doc => units.push({ id: doc.id, ...doc.data() }));

  renderModules(modules, units, userData, user);
});

function renderModules(modules, units, userData, user) {

  modulesContainer.innerHTML = "";
  debugContainer.innerHTML = "";
  rawLinksContainer.innerHTML = "";

  const row = document.createElement("div");
  row.className = "row";

  modules.forEach(module => {

    const col = document.createElement("div");
    col.className = "col-12 col-md-6 col-lg-4 mb-4";

    const card = document.createElement("div");
    card.className = "card h-100 shadow-sm";

    const cardHeader = document.createElement("div");
    cardHeader.className = "card-header text-bg-primary";
    cardHeader.innerHTML = `<a class="text-bg-primary text-decoration-none" href="units.html?module=${module.id}">${module.num}. ${module.name}</a>`;

    if (module.description) {
      cardHeader.setAttribute("data-bs-toggle", "tooltip");
      cardHeader.setAttribute("title", module.description);
    }

    const listGroup = document.createElement("div");
    listGroup.className = "list-group list-group-flush";

    const moduleUnits = units
      .filter(u => u.module.id === module.id)
      .sort((a, b) => a.num - b.num);

    moduleUnits.forEach(unit => {

      const progressValue = userData[unit.id];
      const avgScoreValue = userData[unit.id + "_Score"] || 0;

      let medal = "";
      // if (avgScoreValue >= 99.5) medal = "&#128175;";
      // else if (avgScoreValue >= 90) medal = "&#129351;";
      if (avgScoreValue >= 90) medal = "&#129351;";
      else if (avgScoreValue >= 80) medal = "&#129352;";
      else if (avgScoreValue >= 70) medal = "&#129353;";

      const isLocked = progressValue === undefined || progressValue === -1;
      const completionCount = progressValue > 0 ? progressValue : 0;

      const unitItem = document.createElement("div");
      unitItem.className =
        "list-group-item " + (isLocked ? "locked" : "unlocked");

      // unitItem.innerHTML =
      //   `<strong>${module.num}.${unit.num}</strong> ${unit.name}` +
      //   (completionCount > 0 ? ` - ${completionCount}&#127942;` : "") +
      //   (avgScoreValue > 0 ? ` ${medal}` : "") +
      //   (isLocked ? "&#128274; " : "");


      unitItem.innerHTML = `<span class="unit-title" data-bs-toggle="tooltip" title="${unit.description || ''}">
                            <strong>${module.num}.${unit.num}</strong> ${unit.name}</span>`;
      unitItem.innerHTML += (avgScoreValue > 0 ? `<span class="large-icon" data-bs-toggle="tooltip" title="Recent score average ${avgScoreValue.toFixed(1)}%"> ${medal}</span>` : "");
      unitItem.innerHTML += (completionCount > 0 ? `<span>${completionCount}<span class="large-icon">&#127942;</span></span>` : "");

      unitItem.innerHTML += (isLocked ? `<span class="large-lock">&#128274;</span>` : "");

      unitItem.classList.add("unit-flex", "pe-1");


      // Only apply score color if unlocked
      if (!isLocked && avgScoreValue > 0) {
        unitItem.style.backgroundColor = getUnitColor(avgScoreValue);
      }

      // if (unit.description) {
      //   unitItem.setAttribute("data-bs-toggle", "tooltip");
      //   unitItem.setAttribute("title", unit.description);
      // }

      if (!isLocked) {
        unitItem.onclick = () => {
          // window.location.href = unit.url;
          window.location.href = `units/${module.id}/${unit.id}.html`;
        };
      }

      listGroup.appendChild(unitItem);

      // DEBUG BUTTON
      const debugBtn = document.createElement("button");
      debugBtn.classList.add("btn", isLocked ? "btn-danger" : "btn-success");
      debugBtn.type = "button";
      debugBtn.textContent = isLocked
        ? `Unlock ${unit.id}`
        : `Lock ${unit.id}`;

      debugBtn.onclick = async () => {
        const newValue = isLocked ? 0 : -1;
        await updateDoc(doc(db, "users", user.uid), {
          [unit.id]: newValue
        });
        location.reload();
      };

      debugContainer.appendChild(debugBtn);

      const rawLink = document.createElement("a");
      rawLink.href = `units/${module.id}/${unit.id}.html`;
      // rawLink.textContent = unit.url;
      rawLink.textContent = `units/${module.id}/${unit.id}.html`;
      rawLink.style.display = "block";
      rawLinksContainer.appendChild(rawLink);
    });

    card.appendChild(cardHeader);
    card.appendChild(listGroup);
    col.appendChild(card);
    row.appendChild(col);
  });

  modulesContainer.appendChild(row);

  // const tooltipTriggerList = [].slice.call(
  //   document.querySelectorAll('[data-bs-toggle="tooltip"]')
  // );

  // tooltipTriggerList.forEach(el => {
  //   new bootstrap.Tooltip(el);
  // });

  const tooltipTriggerList = [].slice.call(
    document.querySelectorAll('[data-bs-toggle="tooltip"]')
  );

  tooltipTriggerList.forEach(el => {
    new bootstrap.Tooltip(el, {
      delay: { "show": 500, "hide": 100 } // show after 500ms, hide after 100ms
    });
  });
}

</script>

<div id="footer"></div>
</body>
</html>
