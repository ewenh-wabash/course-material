<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="../../../bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../../modules.css">
  <script src="../../../bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../../../ui.js"></script>
</head>
<body>
  <div id="header"></div>
  <div id="lockedMessage" style="display:none;"></div>
  <div id="moduleContent" class="mt-4">
    <div class="row g-4 mx-3">

      <!-- LEFT COLUMN — Instructions / Game -->
      <div class="col-md-9">
        <div class="card h-100 shadow-sm">
          <div class="card-header text-bg-primary unclickable pe-2">
            <h5 class="mb-0 d-flex justify-content-between align-items-center">
              <span>Instructions</span>
              <span>
                <span id="totalUnitCount" class="pe-1"></span>
                <span class="header-trophy">&#127942;</span>
              </span>
            </h5>
          </div>
          <div class="card-body text-center">
            <p id="instructionText" class="lead">
              Wait for the <span data-meaning="sound">beep</span>, then click your mouse or press any key as soon as you hear it.<br/>
              <small class="text-muted">
                Note: this does not count toward final scores, it's just for fun.
              </small>
            </p>
            <button id="startBtn" class="btn btn-primary btn-lg my-3">
              Start
            </button>
            <h3 id="statusText" class="my-4"></h3>
            <h4 id="resultText" class="my-3 text-success"></h4>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN — Scores -->
      <div class="col-md-3">
        <div class="card h-100 shadow-sm">
          <div id="scoresHeader" class="card-header text-bg-light unclickable pe-0">
            <h5 class="mb-0 pe-0"><span id="scoreAvg" class="d-flex justify-content-between align-items-center"></span></h5>
          </div>
          <div class="card-body">
            <div id="pastTimes" class="list-group">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    const unitName = "Reaction Time";
    const unitId = "reactionTime";

    import { currentUser } from '../../../auth.js';
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { checkModuleAccess } from '../../../module-loader.js';
    import { setupPage } from '../../../layout.js';
    import { dictionary } from "../../../dictionary.js";
    import { scaleAndClamp } from "../../../math.js";
    import { submitUnitScore, renderScoreHeader, renderUnitCount, appendScoreRow } from "../../../dbFuncs.js";

    const db = getFirestore();
    setupPage(unitName);

    // Wait for DOM
    document.addEventListener("DOMContentLoaded", async () => {
      const waitForUser = () => new Promise(resolve => {
        const check = () => {
          if (currentUser) resolve(currentUser);
          else setTimeout(check, 100);
        };
        check();
      });
      await waitForUser();

      // Check module access
      await checkModuleAccess(db, unitId);

      // Grab stats for user average score
      const userRef = doc(db, "users", currentUser.uid);
      const docSnap = await getDoc(userRef);
      const initialScore = docSnap.exists() ? docSnap.data()[`${unitId}_Score`] || 0 : 0;
      const initialCount = docSnap.data()[unitId] || 0;

      renderScoreHeader(initialScore);
      renderUnitCount(initialCount, "totalUnitCount");
    });

    const startBtn = document.getElementById("startBtn");
    const statusText = document.getElementById("statusText");
    const resultText = document.getElementById("resultText");

    let audioCtx;
    let startTime = null;
    let waitingForBeep = false;
    let listeningForReaction = false;
    let timeoutId = null;
    let currentOscillator = null;
    let currentGain = null;
    let beepTimeout = null;

    // Utility delay
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // Beep sound (1 second)
    function playBeep() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      currentOscillator = audioCtx.createOscillator();
      currentGain = audioCtx.createGain();

      currentOscillator.type = "sine";
      currentOscillator.frequency.setValueAtTime(300 + Math.random()*700, audioCtx.currentTime);

      currentOscillator.connect(currentGain);
      currentGain.connect(audioCtx.destination);

      currentOscillator.start();

      // Auto-stop after 1 second
      beepTimeout = setTimeout(() => { stopBeep(); }, 1000);
    }

    function stopBeep() {
      if (currentOscillator) {
        try {
          currentOscillator.stop();
        } catch (e) {}
        currentOscillator.disconnect();
        currentOscillator = null;
      }

      if (beepTimeout) {
        clearTimeout(beepTimeout);
        beepTimeout = null;
      }
    }

    // Reset to idle state
    function resetToIdle(buttonText = "Try Again") {
      startBtn.textContent = buttonText;
      startBtn.style.display = "inline-block";
      waitingForBeep = false;
      listeningForReaction = false;
    }

    // Start round
    async function startRound() {
      startBtn.style.display = "none";
      resultText.textContent = "";
      statusText.textContent = "Ready...";

      await sleep(600 + Math.random() * 400);
      statusText.textContent = "Set...";
      await sleep(600 + Math.random() * 400);
      statusText.textContent = "Listen!";

      waitingForBeep = true;

      const randomDelay = 1500 + Math.random() * 2500;

      timeoutId = setTimeout(() => {
        waitingForBeep = false;
        listeningForReaction = true;
        playBeep();
        startTime = performance.now();
      }, randomDelay);
    }

    // Handle reaction
    async function handleReaction() {
      const threshold = 50;

      // Early click
      if (waitingForBeep) {
        clearTimeout(timeoutId);
        statusText.textContent = "";
        resultText.textContent = "Too early!";
        appendScoreRow("False start", null);
        resetToIdle("Try Again");
        return;
      }

      // Valid reaction
      if (listeningForReaction) {
        listeningForReaction = false;
        stopBeep();

        const reactionTime = performance.now() - startTime;
        const ms = reactionTime.toFixed(0);

        // submitReactionScore(ms);
        const score = scaleAndClamp(ms, 150, 1000, 100, 0);

        if (score >= threshold) {
          const rtcEl = document.getElementById("totalUnitCount");
          const currentCount = parseInt(rtcEl.textContent, 10) || 0;
          rtcEl.textContent = currentCount + 1;
          fireConfetti();
        }

        appendScoreRow(`${ms}ms`, score);
        statusText.textContent = "";
        resultText.textContent = `Your reaction time: ${ms} ms`;

        resetToIdle("Try Again");

        const newScoreAvg = await submitUnitScore({
          db,
          currentUser,
          unitId,
          unitName,
          score,
          scoreField: `${unitId}_Score`,
          countField: unitId,
          threshold
        });

        renderScoreHeader(newScoreAvg);
      }
    }

    // Event listeners
    startBtn.addEventListener("click", startRound);
    document.addEventListener("mousedown", handleReaction);
    document.addEventListener("keydown", handleReaction);
  </script>
  <div id="footer"></div>
</body>
</html>
