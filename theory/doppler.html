<h1>Doppler Effect Visualizer</h1>
drag either dot to hear the doppler effect

<div id="top">
  <canvas id="waves" width="690" height="180"></canvas>
  <div id="settings">
    WAVEFORM:
    <select id="waveSelect">
      <option value="none">none</option>
      <option value="sine">sine</option>
      <option value="siren">siren</option>
      <option value="music">music</option>
    </select>
    <br/><br/><br/>
    <label>MAX VELOCITY:</label><br>
    383.6 mph<br/>
    (half the speed of sound)
  </div>
</div>

<canvas id="field" width="900" height="500"></canvas>

<script>
// ---------------- CONFIG ----------------
const waveSpeed = 200;
const maxSpeed = waveSpeed * 0.5;
const emitRate = 1.8;
const baseFreq = 1.2;
const audioBaseFreq = 440;
let smoothedPlaybackRate = 1;
let dopplerColor = "#fff";

// ---------------- CANVAS ----------------
const waveCanvas = document.getElementById("waves");
const waveCtx = waveCanvas.getContext("2d");

const fieldCanvas = document.getElementById("field");
const fieldCtx = fieldCanvas.getContext("2d");

// ---------------- OBJECTS ----------------
let source = {x:600,y:250,vx:0,vy:0,tx:600,ty:250};
let observer = {x:300,y:250,vx:0,vy:0,tx:300,ty:250};

let dragging = null;

// ---------------- WAVES ----------------
let waves = [];
let lastEmit = 0;

// ---------------- HISTORY ----------------
let samples = 800;
let sourceHist = new Array(samples).fill(0);
let observerHist = new Array(samples).fill(0);
let colorHist = new Array(samples).fill("#fff");

// ---------------- AUDIO ----------------
const ctx = new (window.AudioContext||window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.connect(gain).connect(ctx.destination);
gain.gain.value = 0.08;
osc.start();

document.body.addEventListener("mousedown", () => {
  if (ctx.state !== "running") ctx.resume();
});

const sirenAudio = document.getElementById("sirenAudio");
const musicAudio = document.getElementById("musicAudio");

let currentAudio = null;
let mode = "none";


function setWaveform(type){
  mode = type;

  // stop everything
  gain.gain.value = 0;
  if(currentAudio){
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }

  if(type === "none"){
    return;
  }

  if(type === "sine"){
    gain.gain.value = 0.08;
    osc.type = "sine";
    return;
  }

  if(type === "siren") currentAudio = sirenAudio;
  if(type === "music") currentAudio = musicAudio;

  currentAudio.preservesPitch = false;
  currentAudio.mozPreservesPitch = false;
  currentAudio.webkitPreservesPitch = false;

  currentAudio.play();
}

document.getElementById("waveSelect").onchange=e=>setWaveform(e.target.value);
setWaveform("none");

// ---------------- DRAG ----------------
fieldCanvas.onmousedown = e => {
  let r = fieldCanvas.getBoundingClientRect();
  let x = e.clientX - r.left;
  let y = e.clientY - r.top;

  if(dist(x,y,source.x,source.y)<15) dragging = source;
  else if(dist(x,y,observer.x,observer.y)<15) dragging = observer;
};

window.onmouseup = () => dragging = null;

window.onmousemove = e => {
  if(!dragging) return;
  let r = fieldCanvas.getBoundingClientRect();
  dragging.tx = e.clientX - r.left;
  dragging.ty = e.clientY - r.top;
};

// ---------------- DOPPLER (NORMALIZED) ----------------
function getObservedFreq(){
  let dx = observer.x - source.x;
  let dy = observer.y - source.y;
  let d = Math.hypot(dx,dy) || 1;

  let ux = dx/d, uy = dy/d;

  // observer: toward source = positive
  let vo = -(observer.vx*ux + observer.vy*uy);

  // source: toward observer = positive (FIXED SIGN)
  let vs = (source.vx*ux + source.vy*uy);

  // normalize each independently to [-1, 1]
  let oNorm = Math.max(-1, Math.min(1, vo / maxSpeed));
  let sNorm = Math.max(-1, Math.min(1, vs / maxSpeed));

  // ADD contributions (this is what you wanted)
  let total = oNorm + sNorm;

  // clamp total range to [-2, 2]
  total = Math.max(-2, Math.min(2, total));

  // convert to frequency (log scale)
  let freqMultiplier = Math.pow(2, total); // divide total by something to reduce the frequency width

  return audioBaseFreq * freqMultiplier;
}

// ---------------- LOOP ----------------
let last = performance.now();
let phaseSrc = 0;
let phaseObs = 0;
let smoothedFreq = 1;

function loop(now){
  let dt = (now-last)/1000;
  last = now;

  // EMIT WAVES
  if(now-lastEmit > 1000/emitRate){
    waves.push({x:source.x,y:source.y,r:0});
    lastEmit = now;
  }

  waves.forEach(w=>w.r += waveSpeed*dt);
  waves = waves.filter(w=>w.r < 2000);

  // SMOOTH MOVEMENT
  [source, observer].forEach(p=>{
    let dx = p.tx - p.x;
    let dy = p.ty - p.y;

    let dist = Math.hypot(dx,dy);
    if(dist > 1){
      let speed = Math.min(maxSpeed, dist*5);
      p.vx = (dx/dist)*speed;
      p.vy = (dy/dist)*speed;

      p.x += p.vx * dt;
      p.y += p.vy * dt;
    } else {
      p.vx *= 0.8;
      p.vy *= 0.8;
    }
  });

  // PHASE (smooth)
  let targetFreq = getObservedFreq()/audioBaseFreq;
  smoothedFreq += (targetFreq - smoothedFreq) * 0.08;

  phaseSrc += baseFreq * dt * 2*Math.PI;
  phaseObs += baseFreq * smoothedFreq * dt * 2*Math.PI;

  let srcVal = Math.sin(phaseSrc);
  let obsVal = Math.sin(phaseObs);

  // COLOR
  let shift = smoothedFreq - 1;

  if (shift > 0) {
    let t = Math.min(shift * 2, 1);
    dopplerColor = `rgb(255,${200*(1-t)},${200*(1-t)})`;
  } else {
    let t = Math.min(-shift * 2, 1);
    dopplerColor = `rgb(${200*(1-t)},${200*(1-t)},255)`;
  }

  // HISTORY
  sourceHist.push(srcVal);
  observerHist.push(obsVal);
  colorHist.push(dopplerColor);

  sourceHist.shift();
  observerHist.shift();
  colorHist.shift();

  drawField();
  drawGraphs();

  // AUDIO
  let freq = getObservedFreq();
  let targetRate = freq / audioBaseFreq;

  // clamp
  targetRate = Math.max(0.25, Math.min(4, targetRate));

  // smooth (ALWAYS safe now)
  smoothedPlaybackRate += (targetRate - smoothedPlaybackRate) * 0.08;

  if(mode === "sine"){
    osc.frequency.setTargetAtTime(freq, ctx.currentTime, 0.05);
  } else if(currentAudio){
    currentAudio.playbackRate = smoothedPlaybackRate;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function getIntervalLabel(baseFreq, newFreq) {
  if (!baseFreq || !newFreq) return "";

  // semitone distance
  const semitones = 12 * Math.log2(newFreq / baseFreq);

  const nearest = Math.round(semitones);
  const diff = Math.abs(semitones - nearest);

  // const veryClose = 1 / 16;
  // const close = 1 / 8;

  // if (diff > close) return "";

  // Interval names (0–24 semitones = 2 octaves)
  const intervalNames = [
    "PU","m2","M2","m3","M3","P4","TT","P5",
    "m6","M6","m7","M7","P8",
    "m9","M9","m10","M10","P11","TT","P12",
    "m13","M13","m14","M14","P15"
  ];

  let index = Math.abs(nearest);
  if (index > 24) return "";

  let name = intervalNames[index];

  // direction
  let sign = nearest >= 0 ? "+" : "−";
  if (nearest == 0) {
    sign = "";
  }

  return `${sign}${name}`;
  // if (diff <= veryClose) {
  //   return `${sign}${name}`;
  // } else {
  //   return `~${sign}${name}`;
  // }
}

// ---------------- DRAW ----------------
function drawField(){
  fieldCtx.clearRect(0,0,fieldCanvas.width,fieldCanvas.height);

  fieldCtx.strokeStyle="green";
  fieldCtx.lineWidth = 4;
  waves.forEach(w=>{
    fieldCtx.beginPath();
    fieldCtx.arc(w.x,w.y,w.r,0,Math.PI*2);
    fieldCtx.stroke();
  });

  drawDot(source,"#0f0","🔊");
  drawDot(observer,"#aaa","👂");

  // DRAW TARGET LINES
  [source, observer].forEach(p => {
    // draw line from current position to target
    if(p.x !== p.tx || p.y !== p.ty){
      fieldCtx.strokeStyle = "#888";
      fieldCtx.lineWidth = 2;
      fieldCtx.beginPath();
      fieldCtx.moveTo(p.x, p.y);
      fieldCtx.lineTo(p.tx, p.ty);
      fieldCtx.stroke();
      fieldCtx.lineWidth = 1; // reset
    }
  });
}

function drawDot(p,color,label){
  fieldCtx.fillStyle=color;
  fieldCtx.beginPath();
  fieldCtx.arc(p.x,p.y,20,0,Math.PI*2);
  fieldCtx.fill();

  fieldCtx.fillStyle="#000";
  fieldCtx.font = "48px helvetica";
  fieldCtx.fillText(label,p.x-20,p.y+14);
}

function drawGraphs(){
  waveCtx.clearRect(0,0,waveCanvas.width,waveCanvas.height);
  let h = waveCanvas.height;

  // SOURCE
  waveCtx.strokeStyle="#aaa";
  waveCtx.beginPath();
  for(let i=0;i<samples;i++){
    let x=i*(waveCanvas.width/samples);
    let y=h*0.3 + sourceHist[i]*25;
    if(i===0) waveCtx.moveTo(x,y);
    else waveCtx.lineTo(x,y);
  }
  waveCtx.stroke();

  // OBSERVER
  for(let i=1;i<samples;i++){
    let x1=(i-1)*(waveCanvas.width/samples);
    let x2=i*(waveCanvas.width/samples);

    let y1=h*0.75 + observerHist[i-1]*25;
    let y2=h*0.75 + observerHist[i]*25;

    waveCtx.strokeStyle=colorHist[i];
    waveCtx.beginPath();
    waveCtx.moveTo(x1,y1);
    waveCtx.lineTo(x2,y2);
    waveCtx.stroke();
  }

  waveCtx.font = "32pt Helvetica";
  waveCtx.textAlign = "right";       // align to right
  waveCtx.textBaseline = "middle";

  let padding = 10;                   // distance from right edge
  let rightX = waveCanvas.width - padding;

  waveCtx.fillText("👂", rightX + 14, h*0.3);  // source waveform
  waveCtx.fillText("🔊", rightX+ 10, h*0.75); // observer waveform

  // INTERVAL DISPLAY
  let observedFreq = getObservedFreq();
  let interval = getIntervalLabel(audioBaseFreq, observedFreq);

  if (interval) {
    // waveCtx.fillStyle = "#fff";
    waveCtx.fillStyle = dopplerColor;
    waveCtx.font = "20pt Helvetica";
    waveCtx.textAlign = "center";
    waveCtx.textBaseline = "top";

    let x = (observedFreq / audioBaseFreq).toFixed(2) + "x";
    waveCtx.fillText(
      `${x} (${interval})`,
      waveCanvas.width / 2,
      10
    );
  }
}

// ---------------- UTIL ----------------
function dist(x1,y1,x2,y2){
  return Math.hypot(x1-x2,y1-y2);
}
